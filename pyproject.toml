[project]
name = "confianza-ips-backend"
version = "0.1.0"
description = "API institucional para la IPS ficticia Confianza"
readme = "README.md"
authors = [
    { name = "Alexi Dg", email = "alexisdurangomez588@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16.5,<2",
    "email-validator>=2.3.0,<3",
    "fastapi>=0.117.1,<1",
    "psycopg[binary]>=3.2.10,<4",
    "pydantic-settings>=2.11.0,<3",
    "pyjwt>=2.10.1,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2.0.43,<3",
    "uvicorn[standard]>=0.37.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9",
    "pytest-cov>=6.3.0,<7",
    "httpx2>=2.15.0,<3",
    "ruff>=0.13.0,<1",
]

[project.scripts]
confianza-ips-backend = "confianza_ips_backend:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "src.confianza_ips_backend.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: exercises the FastAPI application with a database-backed client fixture",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
ignore = ["B008", "UP017"]
